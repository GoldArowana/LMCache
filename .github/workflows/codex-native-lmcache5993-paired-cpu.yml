name: LMCache5993 paired CPU and strict docs validation
on:
  push:
    branches: ['codex-ci/lmcache5993-native7207bc1c-cpu']
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - role: current-dev
            source_commit: e028a2bbdb011b61f5e3622a84b92d3b4f443731
            source_tree: 46b005f3a8134823c8ac262b009715873abe652e
          - role: candidate
            source_commit: 937062cbce141a34434ec3466d0bdb6e523afe14
            source_tree: a31a59280e7b31d6ba1b1c20cc7d7d461782c29e
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SOURCE_REPOSITORY: GoldArowana/LMCache
      SOURCE_COMMIT: ${{ matrix.source_commit }}
      SOURCE_TREE: ${{ matrix.source_tree }}
      SOURCE_ROLE: ${{ matrix.role }}
      CANDIDATE_COMMIT: 937062cbce141a34434ec3466d0bdb6e523afe14
      CANDIDATE_TREE: a31a59280e7b31d6ba1b1c20cc7d7d461782c29e
      BASE_COMMIT: e028a2bbdb011b61f5e3622a84b92d3b4f443731
      PREVIOUS_COMMIT: 1df784fb6f0829fd5f6a74481b0758dc876cd38b
      NO_GPU_EXT: '1'
      SETUPTOOLS_SCM_PRETEND_VERSION_FOR_LMCACHE: 0.0.0+native5993
      MAX_JOBS: '2'
      OMP_NUM_THREADS: '2'
      LMCACHE_TRACK_USAGE: 'false'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
      PIP_NO_CACHE_DIR: '1'
      PYTHONUNBUFFERED: '1'
    defaults:
      run:
        working-directory: source
        shell: bash
    steps:
      - name: Checkout exact matrix source rather than CI event
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          repository: GoldArowana/LMCache
          ref: ${{ matrix.source_commit }}
          fetch-depth: 2
          persist-credentials: false
          path: source
      - name: Checkout same pinned regression for both sources
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          repository: GoldArowana/LMCache
          ref: 937062cbce141a34434ec3466d0bdb6e523afe14
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: tests/cli/commands/test_quota.py
          sparse-checkout-cone-mode: false
          path: regression-source
      - name: Assert source and external regression identity
        id: identity
        run: |
          set -euo pipefail
          test "$SOURCE_REPOSITORY" = 'GoldArowana/LMCache'
          test "$GITHUB_REPOSITORY" = "$SOURCE_REPOSITORY"
          test "$GITHUB_REF" = "refs/heads/codex-ci/lmcache5993-native7207bc1c-cpu"
          test "$GITHUB_SHA" != "$CANDIDATE_COMMIT"
          test "$GITHUB_SHA" != "$BASE_COMMIT"
          test "$(git remote get-url origin)" = 'https://github.com/GoldArowana/LMCache'
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          if test "$SOURCE_ROLE" = candidate; then
            test "$(git rev-parse HEAD^1)" = "$PREVIOUS_COMMIT"
            test "$(git rev-parse HEAD^2)" = "$BASE_COMMIT"
          else
            test "$SOURCE_COMMIT" = "$BASE_COMMIT"
          fi
          test "$(git -C ../regression-source rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          test "$(git -C ../regression-source rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test "$(git -C ../regression-source hash-object tests/cli/commands/test_quota.py)" = '9ae8b51b9acaaf0fdad1dc3b8c39983a5a50b546'
          git diff HEAD --exit-code
          git -C ../regression-source diff HEAD --exit-code
          cp ../regression-source/tests/cli/commands/test_quota.py "$RUNNER_TEMP/test_quota_same_regression.py"
          printf 'SOURCE_REPOSITORY=%s\nSOURCE_COMMIT=%s\nSOURCE_TREE=%s\nSOURCE_ROLE=%s\nCI_EVENT_COMMIT=%s\n' "$SOURCE_REPOSITORY" "$SOURCE_COMMIT" "$SOURCE_TREE" "$SOURCE_ROLE" "$GITHUB_SHA" | tee "$RUNNER_TEMP/source-identity.txt"
      - name: Setup documented Python 3.12
        id: python_setup
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12'
      - name: Bootstrap documented CPU common C++ extensions
        id: bootstrap
        run: |
          set -euo pipefail
          test -z "${NO_NATIVE_EXT:-}"
          test -z "${NO_CUDA_EXT:-}"
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements/build.txt -r requirements/test.txt -r requirements/common.txt -r requirements/cli.txt pre-commit
          NO_GPU_EXT=1 python -m pip install -e . --no-build-isolation --no-deps
          NO_GPU_EXT=1 python setup.py build_ext --inplace
          python lmcache/v1/transport/grpc/_proto_gen/_generate.py
          python --version > "$RUNNER_TEMP/python-cpu.txt"
          python -m pip list --format=json > "$RUNNER_TEMP/python-packages-after-cpu.json"
          python - <<'PY'
          import pathlib, sys, torch, lmcache
          import lmcache.lmcache_native as native
          import lmcache.lmcache_fs
          import lmcache.lmcache_redis
          print(sys.version, torch.__version__, lmcache.__file__, native.__file__)
          assert torch.version.cuda is None
          assert lmcache.torch_device_type == 'cpu'
          assert lmcache.device_ops.device_type == 'cpu'
          assert pathlib.Path(lmcache.__file__).resolve().parent == pathlib.Path.cwd() / 'lmcache'
          assert hasattr(native, 'TransferDirection')
          PY
          git diff HEAD --exit-code
      - name: Same regression against exact current dev and candidate
        id: regression
        run: |
          set -euo pipefail
          set +e
          PYTHONPATH="$PWD" python -m pytest -q -c /dev/null --rootdir="$RUNNER_TEMP" --confcutdir="$RUNNER_TEMP" "$RUNNER_TEMP/test_quota_same_regression.py" --junitxml="$RUNNER_TEMP/same-regression.xml" 2>&1 | tee "$RUNNER_TEMP/same-regression.log"
          rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$rc" > "$RUNNER_TEMP/same-regression.exit"
          python - <<'PY'
          import json, os, pathlib, xml.etree.ElementTree as ET
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          root = ET.parse(temp / 'same-regression.xml').getroot()
          suite = root if root.tag == 'testsuite' else root.find('testsuite')
          report = {'source_role': os.environ['SOURCE_ROLE'], 'source_commit': os.environ['SOURCE_COMMIT'], 'exit_code': int((temp / 'same-regression.exit').read_text()), 'counts': dict(suite.attrib), 'failed_cases': [case.attrib for case in suite.findall('testcase') if case.find('failure') is not None], 'errors': [case.attrib for case in suite.findall('testcase') if case.find('error') is not None]}
          (temp / 'same-regression.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          if report['errors'] or int(suite.get('skipped', '0')) or int(suite.get('tests', '0')) != 17:
              raise SystemExit('Regression did not fully execute')
          if os.environ['SOURCE_ROLE'] == 'candidate':
              if report['exit_code'] or int(suite.get('failures', '0')):
                  raise SystemExit('Candidate regression failed')
          else:
              expected = {
                  'test_get_response_schemas[response1]',
                  'test_get_coordinator_without_explicit_quota[0.0]',
                  'test_get_coordinator_without_explicit_quota[0.125]',
                  'test_list_response_schemas[response1]',
                  'test_list_coordinator_explicit_zero_quota',
              }
              actual = {case['name'] for case in report['failed_cases']}
              if report['exit_code'] != 1 or int(suite.get('failures', '0')) != 5 or actual != expected:
                  raise SystemExit('Current-dev failure did not match the narrow schema regression')
          PY
          git diff HEAD --exit-code
      - name: Complete repository CLI suite on each exact source
        id: cli
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: |
          set -euo pipefail
          set +e
          python -m pytest -q tests/cli --junitxml="$RUNNER_TEMP/cli.xml" 2>&1 | tee "$RUNNER_TEMP/cli.log"
          rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$rc" > "$RUNNER_TEMP/cli.exit"
          git diff HEAD --exit-code
          exit "$rc"
      - name: Documented non-Rust pre-commit checks on each exact source
        id: lint
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: |
          set -euo pipefail
          set +e
          SKIP=rust-fmt,rust-clippy pre-commit run --all-files 2>&1 | tee "$RUNNER_TEMP/pre-commit.log"
          rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$rc" > "$RUNNER_TEMP/pre-commit.exit"
          git diff HEAD --exit-code
          exit "$rc"
      - name: Strict repository Sphinx build on exact source
        id: docs
        if: ${{ !cancelled() && steps.identity.outcome == 'success' && steps.python_setup.outcome == 'success' }}
        run: |
          set -euo pipefail
          python -m pip install -r requirements/docs.txt
          python --version > "$RUNNER_TEMP/python-docs.txt"
          sphinx-build --version > "$RUNNER_TEMP/sphinx-version.txt"
          python -m pip list --format=json > "$RUNNER_TEMP/python-packages-after-docs.json"
          cd docs
          make clean
          set +e
          make html SPHINXOPTS="-W --keep-going -N" 2>&1 | tee "$RUNNER_TEMP/docs.log"
          rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$rc" > "$RUNNER_TEMP/docs.exit"
          git diff HEAD --exit-code
          exit "$rc"
      - name: Always verify exact source and regression stayed byte-clean
        if: ${{ always() }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          git diff HEAD --exit-code
          git diff --cached --exit-code
          test "$(git -C ../regression-source rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          test "$(git -C ../regression-source rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          git -C ../regression-source diff HEAD --exit-code
          git -C ../regression-source diff --cached --exit-code
      - name: Preserve bounded paired validation artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: lmcache5993-paired-cpu-${{ matrix.role }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/source-identity.txt
            ${{ runner.temp }}/docs.log
            ${{ runner.temp }}/docs.exit
            ${{ runner.temp }}/same-regression.xml
            ${{ runner.temp }}/same-regression.json
            ${{ runner.temp }}/same-regression.log
            ${{ runner.temp }}/same-regression.exit
            ${{ runner.temp }}/cli.xml
            ${{ runner.temp }}/cli.log
            ${{ runner.temp }}/cli.exit
            ${{ runner.temp }}/pre-commit.log
            ${{ runner.temp }}/pre-commit.exit
            ${{ runner.temp }}/python-cpu.txt
            ${{ runner.temp }}/python-packages-after-cpu.json
            ${{ runner.temp }}/python-docs.txt
            ${{ runner.temp }}/sphinx-version.txt
            ${{ runner.temp }}/python-packages-after-docs.json
